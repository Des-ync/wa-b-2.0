# /etc/nginx/sites-available/wa-saas -> symlink into sites-enabled
# Reverse proxy for the Node app on the Oracle Cloud app VM.
# After copying this into place, run: sudo certbot --nginx -d yourdomain.me
# Certbot will rewrite the server block to add the 443/ssl_certificate lines.

# Edge-level rate limit, in front of (not instead of) the app's own
# express-rate-limit (120 req/min per key). This one is keyed by IP and
# exists so a large enough flood is dropped by Nginx before it ever reaches
# — and CPU-starves — the single Node process. Scoped to this file's own
# `include`d context (the standard Debian/Ubuntu layout includes
# sites-enabled/* inside the main nginx.conf's http{} block), so this must
# stay outside the server{} block below.
limit_req_zone $binary_remote_addr zone=wasaas:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name skes.tech www.skes.tech;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Webhook deliveries (Meta/Paystack/Hubtel) are deliberately NOT
    # edge-rate-limited, matching src/server.js's own apiLimiter exclusion —
    # a provider's retry burst must never be throttled into data loss. This
    # block must stay ahead of the general `location /` below (nginx picks
    # the longest matching prefix, but keeping the more specific rule first
    # reads clearly regardless).
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=wasaas burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Webhook endpoints need the raw body forwarded untouched — no special
    # handling needed here since Nginx proxies the raw request body by default.
    client_max_body_size 2m;
}

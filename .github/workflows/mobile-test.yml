name: Mobile tests

# Deliberately NOT part of deploy.yml. That workflow gates the production
# deploy, and installing the Flutter SDK adds 2-3 minutes to every push to
# main — for a suite that cannot break the backend it is about to ship.
# Running here instead keeps the deploy gate fast while still failing a PR
# that breaks the app.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-test.yml'
  # So the suite can still be run by hand against main after a direct push.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/wab_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is developed against; a channel
          # name would silently move under us and turn an SDK regression
          # into a mystery PR failure.
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - run: flutter pub get

      # Fails on errors and warnings; the repo currently carries a handful of
      # `info`-level lints, so those are not treated as failures yet. Tighten
      # to --fatal-infos once they are cleared (Phase 9's lint gate).
      - run: flutter analyze --fatal-warnings

      - run: flutter test --reporter expanded

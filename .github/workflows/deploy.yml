name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Runs on a clean, disposable runner with no access to production secrets —
  # a failing test here blocks the deploy job below from ever running.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whatsapp_saas_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci

      # Lint before the tests: no-undef catches the class of bug that makes a
      # route HANG rather than fail (an undefined `req`, a missing require),
      # which a passing test suite will not surface if nothing exercises that
      # branch. Eighteen such endpoints shipped before this gate existed.
      - run: npm run lint

      # Fail the build if a credential is about to be committed. The repo
      # already .gitignores .env and the Firebase service account; this
      # catches the case where one arrives under a name nobody thought to
      # ignore.
      - name: Secret scan
        run: |
          set -e
          # Tracked files only — node_modules and untracked scratch files are
          # not what gets deployed.
          FOUND=$(git ls-files -z | xargs -0 grep -nIE \
            -e 'sk_live_[A-Za-z0-9]{16,}' \
            -e 'sk_test_[A-Za-z0-9]{16,}' \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e '"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN' \
            -e 'EAA[A-Za-z0-9]{40,}' \
            2>/dev/null | grep -v '\.env\.example' | grep -v 'eslint.config.js' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::A credential appears to be committed:"
            echo "$FOUND"
            exit 1
          fi
          echo "No committed credentials found."

      - run: npm run migrate
      # One retry: a rare (~5%, observed on Node 26 locally, not yet confirmed
      # on this job's Node 18) supertest/HTTP-parser race unrelated to any
      # single test's own logic can occasionally fail an unrelated test with
      # a garbled-response parse error. A genuine regression fails twice in a
      # row; this only absorbs the rare flake.
      - run: npm test || npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud app VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_APP_HOST }}
          username: ${{ secrets.ORACLE_APP_USER }}
          key: ${{ secrets.ORACLE_APP_SSH_KEY }}
          script: |
            set -e
            cd /opt/wa-b-2.0
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            npm run migrate
            pm2 reload deploy/ecosystem.config.js --update-env
            pm2 save

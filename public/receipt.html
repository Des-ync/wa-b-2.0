<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Receipt · WA-B Solutions</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="receipt.css" />
</head>
<body>

<header class="nav no-print"><div class="wrap nav-row">
  <a href="index.html" class="brand"><img class="brand-logo brand-logo-light" src="assets/logo-light.jpg" alt="WA-B Solutions" /><img class="brand-logo brand-logo-dark" src="assets/logo-dark.jpg" alt="WA-B Solutions" /></a>
</div></header>

<div class="receipt-wrap">
  <div id="loading" class="loading-box">Loading receipt…</div>
  <div id="error" class="err-box" style="display:none"></div>
  <div id="card" class="receipt-card" style="display:none"></div>
  <div id="actions" class="receipt-actions" style="display:none">
    <a id="reorderBtn" class="btn btn-primary" href="#" style="display:none" target="_blank" rel="noopener">🔁 Order again</a>
    <a id="shareBtn" class="btn btn-ghost" href="#" target="_blank" rel="noopener">↗ Share</a>
    <button class="btn btn-ghost" data-click="printPage">Print / Save PDF</button>
    <button class="btn btn-ghost" id="copyLinkBtn">Copy link</button>
  </div>
</div>

<script src="errors.js"></script>
<script src="receipt.js"></script>
<script src="actions.js"></script>
<script src="script.js"></script>
</body>
</html>
